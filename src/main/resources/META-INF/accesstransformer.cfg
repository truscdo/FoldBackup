# FoldBackup — In-memory chunk rollback (方案二)
# Make ChunkAccess.sections accessible and non-final (public-f) so we can
# assign the array reference from outside the declaring class.
# LevelChunk inherits this field from ChunkAccess.
public-f net.minecraft.world.level.chunk.ChunkAccess sections

# Make ChunkMap.markChunkPendingToSend accessible so we can push
# updated chunks to tracking players after in-memory replacement.
public net.minecraft.server.level.ChunkMap markChunkPendingToSend(Lnet/minecraft/server/level/ServerPlayer;Lnet/minecraft/world/level/chunk/LevelChunk;)V

# Make ThreadedLevelLightEngine.updateChunkStatus accessible for
# scheduling lighting recalculation after section replacement.
public net.minecraft.server.level.ThreadedLevelLightEngine updateChunkStatus(Lnet/minecraft/world/level/ChunkPos;)V

# Make ChunkStorage.storageInfo accessible for reading serialised chunk data.
public net.minecraft.world.level.chunk.storage.ChunkStorage storageInfo()Lnet/minecraft/world/level/chunk/storage/RegionStorageInfo;

# Entity rollback: enumerate all target sections and check UUIDs including hidden entities.
public net.minecraft.server.level.ServerLevel entityManager
public net.minecraft.world.level.entity.PersistentEntitySectionManager sectionStorage

# Preview: identify the section's chunk without walking every block update.
public net.minecraft.network.protocol.game.ClientboundSectionBlocksUpdatePacket sectionPos
